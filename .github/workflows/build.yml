name: Plugin bauen
on:
  push:
    branches: [main]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Abhängigkeiten
        run: npm ci --omit=dev
      - name: Tests
        run: node --test test/*.test.js
      - name: Version prüfen (package.json = Dockerfile-Label)
        run: |
          V=$(node -p "require('./package.json').version")
          grep -q "\"version\": \"$V\"" Dockerfile || { echo "Version $V fehlt im Dockerfile-Label"; exit 1; }
          echo "VERSION=$V" >> $GITHUB_ENV
      - uses: docker/setup-buildx-action@v3
      - name: Image bauen (linux/arm64)
        run: |
          docker buildx build --platform linux/arm64 -t de/ollo18/hmip/geraeteverwaltung:$VERSION --load .
          A=$(docker image inspect de/ollo18/hmip/geraeteverwaltung:$VERSION -f '{{.Architecture}}')
          [ "$A" = "arm64" ] || { echo "Falsche Architektur: $A"; exit 1; }
          docker image inspect de/ollo18/hmip/geraeteverwaltung:$VERSION -f '{{index .Config.Labels "de.eq3.hmip.plugin.metadata"}}' | node -e 'const j=JSON.parse(require("fs").readFileSync(0,"utf8"));if(j.version!==process.env.VERSION||!j.friendlyName.de)process.exit(1);console.log("Label ok",j.pluginId,j.version)'
          docker save de/ollo18/hmip/geraeteverwaltung:$VERSION | gzip > hmip-geraeteverwaltung-$VERSION.tar.gz
          ls -la *.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: hmip-geraeteverwaltung-${{ env.VERSION }}
          path: hmip-geraeteverwaltung-*.tar.gz
      - name: Paket an Release hängen
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" hmip-geraeteverwaltung-*.tar.gz --clobber -R "$GITHUB_REPOSITORY"
      - name: Release anlegen (bei Tag-Push)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" hmip-geraeteverwaltung-*.tar.gz --title "$GITHUB_REF_NAME" --notes "Plugin-Paket für die HCU (über HCUweb hochladen)."
