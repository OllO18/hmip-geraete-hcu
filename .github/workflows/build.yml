name: Plugin bauen
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Abhängigkeiten
        run: npm ci --omit=dev
      - name: Tests
        run: node --test test/*.test.js
      - name: Version prüfen (package.json = Dockerfile-Label)
        run: |
          V=$(node -p "require('./package.json').version")
          grep -q "\"version\": \"$V\"" Dockerfile || { echo "Version $V fehlt im Dockerfile-Label"; exit 1; }
          echo "VERSION=$V" >> $GITHUB_ENV
          if [ "${{ github.event_name }}" = "release" ] && [ "${{ github.event.release.tag_name }}" != "v$V" ]; then echo "Release-Tag ${{ github.event.release.tag_name }} passt nicht zur Version v$V"; exit 1; fi
      - uses: docker/setup-buildx-action@v3
      - name: Image bauen (linux/arm64)
        run: |
          docker buildx build --platform linux/arm64 -t de/ollo18/hmip/geraeteverwaltung:$VERSION --load .
          A=$(docker image inspect de/ollo18/hmip/geraeteverwaltung:$VERSION -f '{{.Architecture}}')
          [ "$A" = "arm64" ] || { echo "Falsche Architektur: $A"; exit 1; }
          docker image inspect de/ollo18/hmip/geraeteverwaltung:$VERSION -f '{{index .Config.Labels "de.eq3.hmip.plugin.metadata"}}' | node -e 'const j=JSON.parse(require("fs").readFileSync(0,"utf8"));if(j.version!==process.env.VERSION||!j.friendlyName.de)process.exit(1);console.log("Label ok",j.pluginId,j.version)'
          docker save de/ollo18/hmip/geraeteverwaltung:$VERSION | gzip > hmip-geraetedokumentation-$VERSION.tar.gz
          ls -la *.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: hmip-geraetedokumentation-${{ env.VERSION }}
          path: hmip-geraetedokumentation-*.tar.gz
      - name: Paket auf Zweig "paket" ablegen (nur main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir paket && cp hmip-geraetedokumentation-*.tar.gz paket/ && cd paket
          git init -q && git add . && git -c user.name=github-actions -c user.email=actions@github.com commit -qm "Paket $VERSION"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/paket
      - name: Paket an Release hängen
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" hmip-geraetedokumentation-*.tar.gz --clobber -R "$GITHUB_REPOSITORY"
